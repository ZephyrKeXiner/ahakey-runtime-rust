name: Rust Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build
      run: cargo build --verbose
      
    - name: Run tests
      run: cargo test --verbose

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ahakey-${{ runner.os }}-${{ runner.arch }}
        path: |
          target/debug/ahakey-runtime-rust.exe
        if-no-files-found: error
        retention-days: 14

  build-linux:
  
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Resolve Dependencies
        run:
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev
          
      - name: Build
        run: cargo build --verbose
        
      - name: Run tests
        run: cargo test --verbose
  
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ahakey-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/debug/ahakey-runtime-rust
          if-no-files-found: error
          retention-days: 14

        
