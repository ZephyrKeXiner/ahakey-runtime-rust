name: Rust Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

    - name: upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ahakey-${{ runner.os }}-${{ runner.arch }}
        path: |
          target/release/ahakey-runtime-rust
          target/release/ahakey-runtime-rust.exe
        if-no-files-found: error
        retention-days: 14
